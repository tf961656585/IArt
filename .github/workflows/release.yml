# release.yml —— 公开仓 GitHub Release 草稿构建链。
#
# 触发：仅 workflow_dispatch（发一稿 = 人工手动触发一次构建）。
# 不订阅 tag push：转正（release-promote）会落版本 tag，若 tag 触发构建，Actions 会再次
# 构建并把新资产覆盖到已冻结的正式发布上；正式与否只由人工转正动作决定，tag 不是构建触发器。
#
# 一稿的生命周期由 prepare-release（单写者清场）与 verify-draft-assets（完整性门）夹住：
# - prepare-release 在三个构建 job 之前只跑一次：草稿不存在则以 --target $GITHUB_SHA 创建；
#   已存在则把 target 更新为本次 GITHUB_SHA（草稿记录的来源提交=最新一稿）并清空其全部旧资产
#   （同号覆盖只留最新一稿，防新旧构建混挂）；目标 release 已转正式则直接失败（同号正式冻结）。
# - 三平台三 job 并行：mac（同一 job 内分两次 electron-builder 构建 arm64+x64，保证
#   latest-mac.yml 同时含双架构条目）、win（x64）、linux（x64，AppImage）。所有构建 --publish never。
# - 每个 job 上传前确认目标 release 仍是草稿，不是草稿即终止（绝不上传，防覆盖正式资产）。
# - verify-draft-assets 在三个构建 job 全部完成后校验草稿资产齐全（双架构 dmg、win exe、
#   linux AppImage、三份 feed，且 latest-mac.yml 含 arm64+x64 双条目），不齐即失败——
#   部分平台失败的构建不得作为测试稿交付。
# 上传清单是精选产物（安装包 + .blockmap + latest*.yml），不含 unpacked 中间目录。
#
# 构建步骤只依赖公开快照内存在的 scripts（desktop-release-local.mjs、skill-publish.mjs、
# docs、AGENTS.md、apps/workers 均不入快照，workflow 不得引用）。
# node 22 对齐 engines >=22.0.0 下限（LTS）；pnpm 10.29.2 对齐开发机现用版本
# （pnpm-lock.yaml lockfileVersion 9.0 要求 pnpm >=9）。

name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 代际清场：单写者，只跑一次，三个构建 job 的 needs 前置。
  # 草稿不存在 → 创建（--target 记录来源提交）；已存在 → 更新 target + 清空全部旧资产。
  prepare-release:
    name: Prepare draft release (single writer)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare draft release
        id: prepare
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "package.json version 非法，无法派生草稿 tag：$TAG" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "release $TAG 已是正式发布（同号正式冻结），拒绝在其上继续发草稿；请先在 package.json 进位" >&2
              exit 1
            fi
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
            ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            if [[ -n "$ASSETS" ]]; then
              while IFS= read -r name; do
                [[ -z "$name" ]] && continue
                gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes
              done <<< "$ASSETS"
            fi
            echo "✓ 复用草稿 ${TAG}：target → ${GITHUB_SHA}，旧资产已清空"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "IARTStudio $TAG" \
              --notes "Desktop release $TAG. Draft by CI; promote manually."
            echo "✓ 已创建草稿 ${TAG}（target ${GITHUB_SHA}）"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  release-mac:
    name: Build & upload (macOS arm64 + x64)
    needs: prepare-release
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Build model asset packages
        run: pnpm build:model-asset-packages

      - name: Build backend & desktop-shell
        run: |
          pnpm --filter @iart/backend build
          pnpm --filter @iart/desktop-shell build

      - name: Build desktop static assets
        run: pnpm build:desktop-static

      # 双架构分两次构建（对齐 desktop-release-local.mjs 每架构一次构建 + 依赖切换的
      # 现行路径）：ffmpeg-static（单文件二进制）与 better-sqlite3 electron 运行时
      # （extraResources 单目录）是单槽位原生依赖，每次构建前用 ensure:desktop-deps
      # 的对应形态激活目标架构原生依赖；sharp 平台包由 pnpm-workspace.yaml 的
      # supportedArchitectures 一次性装齐双架构。
      - name: Provision native desktop deps (arm64)
        run: pnpm ensure:desktop-deps

      - name: Generate mac icon
        run: pnpm generate:mac-icon

      - name: Package (macOS arm64)
        run: pnpm exec electron-builder --mac --arm64 --publish never -c.mac.identity=null

      - name: Stage arm64 artifacts
        run: |
          mkdir -p dist-desktop/arm64
          mv dist-desktop/IARTStudio-*.zip dist-desktop/IARTStudio-*.dmg \
             dist-desktop/*.blockmap dist-desktop/latest-mac.yml dist-desktop/arm64/

      - name: Verify packaged native runtimes (arm64)
        run: pnpm verify:packaged-native-runtimes

      - name: Switch native desktop deps to x64
        run: pnpm ensure:desktop-deps:x64

      - name: Package (macOS x64)
        run: pnpm exec electron-builder --mac --x64 --publish never

      - name: Stage x64 artifacts
        run: |
          mkdir -p dist-desktop/x64
          mv dist-desktop/IARTStudio-*.zip dist-desktop/IARTStudio-*.dmg \
             dist-desktop/*.blockmap dist-desktop/latest-mac.yml dist-desktop/x64/

      - name: Verify packaged native runtimes (x64)
        run: pnpm verify:packaged-native-runtimes

      - name: Merge latest-mac.yml (arm64 + x64)
        # 单行命令：run 的普通标量会把行尾 `\` 按字面折叠进 argv（首跑实锤），
        # 禁止在此类 run 里用续行符。
        run: node ./tooling/scripts/merge-mac-update-manifest.mjs dist-desktop/arm64/latest-mac.yml dist-desktop/x64/latest-mac.yml --out dist-desktop/latest-mac.yml

      - name: Upload to draft release
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          # 上传防护：目标必须仍是草稿，否则绝不写入（防覆盖正式发布的冻结资产）。
          IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          if [[ "$IS_DRAFT" != "true" ]]; then
            echo "release $TAG 已不是草稿，拒绝上传（防覆盖正式资产）" >&2
            exit 1
          fi
          FILES=$(find dist-desktop/arm64 dist-desktop/x64 -maxdepth 1 -type f \( \
            -name '*.zip' -o -name '*.dmg' -o -name '*.blockmap' \) ; \
            [[ -f dist-desktop/latest-mac.yml ]] && echo dist-desktop/latest-mac.yml)
          if [[ -z "$FILES" ]]; then
            echo "no release artifacts found" >&2
            exit 1
          fi
          echo "$FILES"
          gh release upload "$TAG" $FILES --clobber --repo "$GITHUB_REPOSITORY"

  release-win:
    name: Build & upload (Windows x64)
    needs: prepare-release
    # 钉 windows-2022（VS2022）：windows-latest 镜像已是 VS18(2026)，node-gyp 11.5.0
    # 的 VS 探测器不认识该版本（find VS unknown version "undefined"），原生模块编译失败。
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Build model asset packages
        run: pnpm build:model-asset-packages

      - name: Build backend & desktop-shell
        run: |
          pnpm --filter @iart/backend build
          pnpm --filter @iart/desktop-shell build

      - name: Build desktop static assets
        run: pnpm build:desktop-static

      - name: Provision native desktop deps
        run: pnpm ensure:desktop-deps

      - name: Package (Windows x64)
        run: pnpm exec electron-builder --win --x64 --publish never

      - name: Verify packaged native runtimes
        run: pnpm verify:packaged-native-runtimes

      - name: Upload to draft release
        shell: bash
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          # 上传防护：目标必须仍是草稿，否则绝不写入（防覆盖正式发布的冻结资产）。
          IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          if [[ "$IS_DRAFT" != "true" ]]; then
            echo "release $TAG 已不是草稿，拒绝上传（防覆盖正式资产）" >&2
            exit 1
          fi
          FILES=$(find dist-desktop -maxdepth 1 -type f \( \
            -name '*.zip' -o -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.blockmap' \
            -o -name 'latest.yml' -o -name 'latest-mac.yml' -o -name 'latest-linux.yml' \) | sort)
          if [[ -z "$FILES" ]]; then
            echo "no release artifacts found in dist-desktop" >&2
            exit 1
          fi
          echo "$FILES"
          gh release upload "$TAG" $FILES --clobber --repo "$GITHUB_REPOSITORY"

  release-linux:
    name: Build & upload (Linux x64 AppImage)
    needs: prepare-release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Build model asset packages
        run: pnpm build:model-asset-packages

      - name: Build backend & desktop-shell
        run: |
          pnpm --filter @iart/backend build
          pnpm --filter @iart/desktop-shell build

      - name: Build desktop static assets
        run: pnpm build:desktop-static

      - name: Provision native desktop deps
        run: pnpm ensure:desktop-deps

      - name: Package (Linux x64 AppImage)
        run: pnpm exec electron-builder --linux --x64 --publish never

      - name: Verify packaged native runtimes
        run: pnpm verify:packaged-native-runtimes

      - name: Upload to draft release
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          # 上传防护：目标必须仍是草稿，否则绝不写入（防覆盖正式发布的冻结资产）。
          IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          if [[ "$IS_DRAFT" != "true" ]]; then
            echo "release $TAG 已不是草稿，拒绝上传（防覆盖正式资产）" >&2
            exit 1
          fi
          FILES=$(find dist-desktop -maxdepth 1 -type f \( \
            -name '*.zip' -o -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.blockmap' \
            -o -name 'latest.yml' -o -name 'latest-mac.yml' -o -name 'latest-linux.yml' \) | sort)
          if [[ -z "$FILES" ]]; then
            echo "no release artifacts found in dist-desktop" >&2
            exit 1
          fi
          echo "$FILES"
          gh release upload "$TAG" $FILES --clobber --repo "$GITHUB_REPOSITORY"

  # 完整性门：三个构建 job 全部成功后校验草稿资产齐全；不齐即失败（该稿不得交付实机测试）。
  verify-draft-assets:
    name: Verify draft assets complete
    needs: [prepare-release, release-mac, release-win, release-linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify draft release assets
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          if [[ "$IS_DRAFT" != "true" ]]; then
            echo "release $TAG 已不是草稿，草稿完整性校验不成立" >&2
            exit 1
          fi
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          MISSING=0
          # 资产名对齐 package.json build 的 artifactName（productName-version-平台段）。
          for name in \
            "IARTStudio-${VERSION}-mac-arm64.dmg" \
            "IARTStudio-${VERSION}-mac-x64.dmg" \
            "IARTStudio-Setup-${VERSION}-x64.exe" \
            "IARTStudio-${VERSION}-linux-x64.AppImage" \
            "latest.yml" \
            "latest-mac.yml" \
            "latest-linux.yml"
          do
            if grep -qxF "$name" <<< "$ASSETS"; then
              echo "  ✓ $name"
            else
              echo "  ✗ 缺资产 ${name}" >&2
              MISSING=1
            fi
          done
          if [[ "$MISSING" -ne 0 ]]; then
            echo "草稿 $TAG 资产不齐，不得交付实机测试" >&2
            exit 1
          fi
          DL_DIR=$(mktemp -d)
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest-mac.yml --dir "$DL_DIR" --clobber
          # latest-mac.yml 必须同时含 arm64 与 x64 条目（electron-updater 双架构消费形状）。
          if grep -q 'mac-arm64' "$DL_DIR/latest-mac.yml" && grep -q 'mac-x64' "$DL_DIR/latest-mac.yml"; then
            echo "  ✓ latest-mac.yml 含 arm64 + x64 双条目"
          else
            echo "✗ latest-mac.yml 缺 arm64 或 x64 条目" >&2
            exit 1
          fi
          echo "✓ 草稿 $TAG 资产齐全（四平台 + 三份 feed）"
